name: Terraform Reusable Workflow

# Called by terraform-dev.yml / terraform-qa.yml / terraform-prod.yml.
#
# Every subfolder under environments/<env>/ (networking, iam, rds, eks,
# compute, s3, ... or any new folder added later) is its OWN independent
# Terraform root module with its own state file. A change to one folder
# only plans/applies/destroys that folder - the others are left alone.
#
# The order modules are applied in - and, in reverse, destroyed in - comes
# from one small file: .github/terraform-module-order.json
# A module that isn't listed there yet just runs last; nothing in this
# workflow needs editing when a new folder is added.
#
# State locks are NEVER deleted automatically. If a run dies mid-operation
# and leaves a stale lock, clearing it is a deliberate, human-invoked action
# via the "unlock" job below - never a routine cleanup step.

on:
  workflow_call:
    inputs:
      environment:
        description: 'Target environment name (dev, qa, prod). Must match environments/<environment> and a GitHub Environment of the same name.'
        required: true
        type: string
      action:
        description: 'Terraform action for manual runs (plan, apply, destroy, unlock)'
        required: false
        type: string
        default: 'plan'
      lock_id:
        description: 'Lock ID to release (only used when action=unlock). Copy this from the "Lock Info" in the failed run''s error output - never guess it.'
        required: false
        type: string
        default: ''
      module_name:
        description: 'Single module folder to target manually (e.g. "s3"). Type "all" to target every module. Leave blank to auto-detect from changed files.'
        required: false
        type: string
        default: ''
      confirm_destroy:
        description: 'Must equal "destroy" to allow the destroy job to run'
        required: false
        type: string
        default: ''
      confirm_unlock:
        description: 'Must equal "unlock" to allow the unlock job to run'
        required: false
        type: string
        default: ''
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true

permissions:
  contents: read

env:
  TF_VERSION: '1.15.6'
  AWS_REGION: 'ap-south-1'
  ENV_DIR: environments/${{ inputs.environment }}
  ORDER_FILE: .github/terraform-module-order.json

concurrency:
  group: terraform-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  # ---------- work out WHICH module folders to touch, and in what order ----------
  detect:
    name: "Resolve target modules (${{ inputs.environment }})"
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.resolve.outputs.modules }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full history, so we can diff against the previous commit

      - name: Resolve module list
        id: resolve
        run: |
          set -euo pipefail
          ALL_ORDERED=$(jq -r '.order[]' "${{ env.ORDER_FILE }}")

          if [ -n "${{ inputs.module_name }}" ] && [ "${{ inputs.module_name }}" != "all" ]; then
            # A single module named manually, e.g. destroying just "s3"
            MODULE="${{ inputs.module_name }}"
            if [ ! -d "${{ env.ENV_DIR }}/$MODULE" ]; then
              AVAILABLE=$(ls -1 "${{ env.ENV_DIR }}" | tr '\n' ' ')
              echo "::error::Module '$MODULE' does not exist under ${{ env.ENV_DIR }}. Available modules: $AVAILABLE"
              exit 1
            fi
            MODULES_JSON=$(jq -cn --arg m "$MODULE" '[$m]')

          elif [ "${{ inputs.module_name }}" = "all" ]; then
            # Every module, in dependency order
            MODULES_JSON=$(printf '%s\n' "$ALL_ORDERED" | jq -R -s -c 'split("\n") | map(select(length>0))')

          else
            # Nothing named manually -> work out what actually changed
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              BASE_SHA="${{ github.event.pull_request.base.sha }}"
              HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            else
              BASE_SHA="${{ github.event.before }}"
              HEAD_SHA="${{ github.sha }}"
            fi

            ZERO_SHA="0000000000000000000000000000000000000000"
            if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "$ZERO_SHA" ]; then
              # First commit on a new branch - no previous commit to diff against.
              # Safe default: treat every module as a candidate.
              CHANGED_DIRS="$ALL_ORDERED"
            else
              CHANGED_DIRS=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- "${{ env.ENV_DIR }}/" \
                | awk -F/ '{print $3}' | sort -u)
            fi

            FINAL=""
            for m in $ALL_ORDERED; do
              if printf '%s\n' "$CHANGED_DIRS" | grep -qx "$m"; then
                FINAL="$FINAL$m"$'\n'
              fi
            done
            for m in $CHANGED_DIRS; do
              if [ -n "$m" ] && ! printf '%s\n' "$ALL_ORDERED" | grep -qx "$m"; then
                FINAL="$FINAL$m"$'\n'
              fi
            done

            MODULES_JSON=$(printf '%s' "$FINAL" | sed '/^$/d' | jq -R -s -c 'split("\n") | map(select(length>0))')
          fi

          echo "modules=$MODULES_JSON" >> "$GITHUB_OUTPUT"
          echo "Resolved modules (apply order): $MODULES_JSON"

  # ---------- plan every resolved module, in dependency order ----------
  plan:
    name: "Terraform plan (${{ inputs.environment }})"
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.result == 'success' && needs.detect.outputs.modules != '[]'
    steps:
      - uses: actions/checkout@v5

      - name: Setup Terraform ${{ env.TF_VERSION }}
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          # Static keys for now - swap to an OIDC role-to-assume for production use.

      - name: Plan each module
        run: |
          set -euo pipefail
          mkdir -p /tmp/plans
          for module in $(echo '${{ needs.detect.outputs.modules }}' | jq -r '.[]'); do
            echo "::group::Plan: $module"
            cd "${{ env.ENV_DIR }}/$module"
            terraform fmt -check -recursive
            terraform init -input=false
            terraform validate -no-color
            terraform plan -lock-timeout=300s -var-file=terraform.tfvars -out=tfplan -no-color
            cd "$GITHUB_WORKSPACE"
            mkdir -p "/tmp/plans/$module"
            cp "${{ env.ENV_DIR }}/$module/tfplan" "/tmp/plans/$module/tfplan"
            echo "::endgroup::"
          done

      - name: Upload plan artifacts
        uses: actions/upload-artifact@v6
        with:
          name: tfplan-${{ inputs.environment }}
          path: /tmp/plans
          retention-days: 1

  # ---------- apply every resolved module, in the SAME dependency order ----------
  apply:
    name: "Terraform apply (${{ inputs.environment }})"
    runs-on: ubuntu-latest
    needs: [detect, plan]
    if: |
      needs.detect.result == 'success' &&
      needs.plan.result == 'success' &&
      needs.detect.outputs.modules != '[]' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
        (github.event_name == 'workflow_dispatch' && inputs.action == 'apply')
      )
    environment: ${{ inputs.environment }}   # <- pauses for the environment's required reviewers
    steps:
      - uses: actions/checkout@v5

      - name: Setup Terraform ${{ env.TF_VERSION }}
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download plan artifacts
        uses: actions/download-artifact@v7
        with:
          name: tfplan-${{ inputs.environment }}
          path: /tmp/plans

      - name: Apply each module
        run: |
          set -euo pipefail
          for module in $(echo '${{ needs.detect.outputs.modules }}' | jq -r '.[]'); do
            echo "::group::Apply: $module"
            cp "/tmp/plans/$module/tfplan" "${{ env.ENV_DIR }}/$module/tfplan"
            cd "${{ env.ENV_DIR }}/$module"
            terraform init -input=false
            terraform apply -lock-timeout=300s -auto-approve -no-color tfplan
            cd "$GITHUB_WORKSPACE"
            echo "::endgroup::"
          done

  # ---------- destroy resolved module(s), in REVERSE dependency order ----------
  destroy:
    name: "Terraform destroy (${{ inputs.environment }})"
    runs-on: ubuntu-latest
    needs: detect
    if: |
      needs.detect.result == 'success' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.action == 'destroy' &&
      inputs.confirm_destroy == 'destroy'
    environment: ${{ inputs.environment }}
    steps:
      - name: Require an explicit target
        run: |
          if [ -z "${{ inputs.module_name }}" ]; then
            echo "::error::Refusing to destroy - set 'module_name' to one folder, or 'all' to tear down every module on purpose."
            exit 1
          fi

      - uses: actions/checkout@v5

      - name: Setup Terraform ${{ env.TF_VERSION }}
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Destroy each module, dependents first
        run: |
          set -euo pipefail
          REVERSED=$(echo '${{ needs.detect.outputs.modules }}' | jq -r 'reverse[]')
          for module in $REVERSED; do
            echo "::group::Destroy: $module"
            cd "${{ env.ENV_DIR }}/$module"
            terraform init -input=false
            terraform destroy -lock-timeout=300s -var-file=terraform.tfvars -auto-approve -no-color
            cd "$GITHUB_WORKSPACE"
            echo "::endgroup::"
          done

  # ---------- unlock: recovery-only, human-invoked, never automatic ----------
  # Terraform's own lock is a safety feature, not a bug. A run should only be
  # unlocked after a human has confirmed - by reading the actual error output
  # of the run that holds it - that the process which created the lock has
  # genuinely stopped. This job never runs on its own; it requires the exact
  # Lock ID from that error message plus a typed confirmation, and it goes
  # through `terraform force-unlock` (which validates the Lock ID) rather
  # than deleting the .tflock object directly.
  unlock:
    name: "Terraform force-unlock (${{ inputs.environment }})"
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' &&
      inputs.action == 'unlock' &&
      inputs.confirm_unlock == 'unlock'
    environment: ${{ inputs.environment }}   # <- same reviewer gate as apply/destroy
    steps:
      - name: Require an explicit single module and Lock ID
        run: |
          if [ -z "${{ inputs.module_name }}" ] || [ "${{ inputs.module_name }}" = "all" ]; then
            echo "::error::Set 'module_name' to exactly one folder - unlock cannot target 'all' at once."
            exit 1
          fi
          if [ -z "${{ inputs.lock_id }}" ]; then
            echo "::error::Set 'lock_id' to the ID shown in the 'Lock Info' block of the failed run's error output. Never guess this value."
            exit 1
          fi

      - uses: actions/checkout@v5

      - name: Verify the module folder exists
        run: |
          if [ ! -d "${{ env.ENV_DIR }}/${{ inputs.module_name }}" ]; then
            AVAILABLE=$(ls -1 "${{ env.ENV_DIR }}" | tr '\n' ' ')
            echo "::error::Module '${{ inputs.module_name }}' does not exist under ${{ env.ENV_DIR }}. Available modules: $AVAILABLE"
            exit 1
          fi

      - name: Setup Terraform ${{ env.TF_VERSION }}
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: terraform force-unlock
        run: |
          cd "${{ env.ENV_DIR }}/${{ inputs.module_name }}"
          terraform init -input=false -no-color
          terraform force-unlock -force "${{ inputs.lock_id }}"