name: Terraform - Dev

on:
  push:
    branches: [master]
    paths:
      - 'environments/dev/**'
  pull_request:
    branches: [master]
    paths:
      - 'environments/dev/**'
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform action'
        required: true
        type: choice
        default: 'plan'
        options: [plan, apply, destroy]
      module_name:
        description: 'Module folder to target, e.g. "s3" (leave blank to auto-detect changed folders; "all" for every module)'
        required: false
        default: ''
      confirm_destroy:
        description: 'Type "destroy" to confirm destruction (only used when action=destroy)'
        required: false
        default: ''

jobs:
  terraform:
    uses: ./.github/workflows/terraform-reusable.yml
    with:
      environment: dev
      action: ${{ github.event.inputs.action || 'plan' }}
      module_name: ${{ github.event.inputs.module_name || '' }}
      confirm_destroy: ${{ github.event.inputs.confirm_destroy || '' }}
    secrets: inherit